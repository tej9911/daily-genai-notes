name: daily-streak-agent

on:
  schedule:
    # Cron is in UTC. Two runs: the second is a safety net if the first is
    # delayed or fails. The agent skips if you've already contributed.
    - cron: "17 13 * * *"   # 18:47 IST
    - cron: "7 17 * * *"    # 22:37 IST
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

permissions:
  contents: write            # needed to push the note

concurrency:
  group: streak-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Run streak agent
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
          STREAK_TZ: Asia/Kolkata
        run: python scripts/streak_agent.py
